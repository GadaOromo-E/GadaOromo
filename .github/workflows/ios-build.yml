name: Build & Upload iOS to TestFlight
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: gadaa-ios-wrapper
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Create www directory
        run: mkdir -p www
      - name: Sync Capacitor
        run: |
          chmod +x node_modules/.bin/cap
          npx cap sync ios
      - name: Patch signing settings in project.pbxproj
        run: |
          python3 <<'EOF'
          import re, sys

          pbxproj = 'ios/App/App.xcodeproj/project.pbxproj'
          with open(pbxproj) as f:
              txt = f.read()

          # Fix ProvisioningStyle in TargetAttributes
          txt = re.sub(r'ProvisioningStyle = Automatic;', 'ProvisioningStyle = Manual;', txt)

          # Find the target-level Release buildSettings block by its stable UUID
          m = re.search(
              r'504EC3181FED79650016851F /\* Release \*/ = \{.*?buildSettings = \{(.*?)\n\t\t\t\};',
              txt, re.DOTALL)
          if not m:
              sys.exit('ERROR: Release config block not found in project.pbxproj')

          blk = m.group(1)

          # Strip any signing keys cap sync may have reset/removed
          for key in ['CODE_SIGN_IDENTITY', 'CODE_SIGN_STYLE',
                      'DEVELOPMENT_TEAM', 'PROVISIONING_PROFILE_SPECIFIER']:
              blk = re.sub(r'\n\t+' + key + r'\b[^\n]+', '', blk)

          # Re-inject at correct alphabetical positions
          blk = re.sub(r'(\n\t+ASSETCATALOG_COMPILER_APPICON_NAME\b[^\n]+)',
              lambda mo: mo.group(1)
                  + '\n\t\t\t\tCODE_SIGN_IDENTITY = "Apple Distribution";'
                  + '\n\t\t\t\tCODE_SIGN_STYLE = Manual;', blk)
          blk = re.sub(r'(\n\t+CURRENT_PROJECT_VERSION\b[^\n]+)',
              lambda mo: mo.group(1) + '\n\t\t\t\tDEVELOPMENT_TEAM = ZY6AQ9855R;', blk)
          blk = re.sub(r'(\n\t+PRODUCT_NAME\b[^\n]+)',
              lambda mo: mo.group(1)
                  + '\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "Gadaa AppStore";', blk)

          txt = txt[:m.start(1)] + blk + txt[m.end(1):]
          with open(pbxproj, 'w') as f:
              f.write(txt)
          print('Signing settings patched successfully')
          EOF
      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install --repo-update
      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
      - name: Install Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
      - name: Build signed IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa
      - name: Upload to TestFlight
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$APPSTORE_KEY_ID.p8
          xcrun altool --upload-app \
            --type ios \
            --file $RUNNER_TEMP/ipa/App.ipa \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"