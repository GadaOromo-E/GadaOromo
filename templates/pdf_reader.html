<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="{{ (book.title ~ ' PDF reader') if book else 'PDF reader' }}" />
  <link rel="canonical" href="{{ (WEBSITE_URL or 'https://gadaadictionary.com') ~ '/read/pdf/' ~ (book.id if book else '') }}">
  <meta name="robots" content="noindex,follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ (book.title ~ ' | PDF Reader') if book else 'PDF Reader' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=20260423-2">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
</head>
<body class="pdf-reader-page pdf-reader-native">
  <main class="native-reader-shell">
    {% if load_error %}
      <section class="result-box native-inline-message">
        <div class="muted">{{ load_error }}</div>
      </section>
    {% endif %}

    {% if reader_error %}
      <section class="result-box native-inline-message">
        <div class="muted">{{ reader_error }}</div>
      </section>
    {% else %}
      <section class="native-reader-stage reader-deterrent" id="native-reader-stage">
        <div class="native-pdf-loading subtle" id="native-pdf-loading">Loading PDF...</div>
        <div class="native-pdf-error muted" id="native-pdf-error" hidden></div>
        <div class="native-canvas-wrap" id="native-canvas-wrap">
          <canvas
            class="native-pdf-canvas"
            id="native-pdf-canvas"
            aria-label="PDF page canvas"
          ></canvas>
        </div>
      </section>
    {% endif %}
  </main>

  {% if not reader_error %}
    <nav class="native-reader-bottom" aria-label="Reader controls">
      <div class="native-reader-bottom-row">
        <a
          href="/book/{{ book.id|urlencode }}"
          class="native-back-btn native-library-btn"
          id="native-exit-link"
          aria-label="Library"
          data-desktop-href="/book/{{ book.id|urlencode }}"
          data-mobile-href="/library-store"
        >
          <span class="control-label control-label-full" id="native-exit-label">Back to Book</span>
          <span class="control-label control-label-compact" aria-hidden="true">Lib</span>
        </a>
        <button class="native-nav-btn" id="native-prev-btn" type="button" aria-label="Previous page">
          <span class="control-label control-label-full">Previous</span>
          <span class="control-label control-label-compact" aria-hidden="true">&lsaquo;</span>
        </button>
        <div class="native-page-chip" id="native-page-chip" aria-label="Current page">Page 1</div>
        <button class="native-nav-btn" id="native-next-btn" type="button" aria-label="Next page">
          <span class="control-label control-label-full">Next</span>
          <span class="control-label control-label-compact" aria-hidden="true">&rsaquo;</span>
        </button>
      </div>
    </nav>
  {% endif %}

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var pdfUrl = {{ pdf_stream_url|tojson }};
      if (!pdfUrl) return;

      var stage = document.getElementById("native-reader-stage");
      var loadingNode = document.getElementById("native-pdf-loading");
      var errorNode = document.getElementById("native-pdf-error");
      var canvasWrap = document.getElementById("native-canvas-wrap");
      var canvas = document.getElementById("native-pdf-canvas");
      var prevBtn = document.getElementById("native-prev-btn");
      var nextBtn = document.getElementById("native-next-btn");
      var pageChip = document.getElementById("native-page-chip");
      var exitLink = document.getElementById("native-exit-link");
      var exitLabel = document.getElementById("native-exit-label");

      if (!stage || !canvasWrap || !canvas || !prevBtn || !nextBtn || !pageChip) return;

      ["contextmenu", "copy", "cut", "selectstart", "dragstart"].forEach(function (eventName) {
        stage.addEventListener(eventName, function (event) {
          event.preventDefault();
        });
      });

      document.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && ["c", "s", "p", "u"].includes((event.key || "").toLowerCase())) {
          event.preventDefault();
        }
      });

      var pdfDoc = null;
      var pageNum = 1;
      var pendingPage = null;
      var isRendering = false;
      var compactBottomBar = window.matchMedia("(max-width: 768px)");
      var zoomScale = 1;
      var minZoomScale = 0.75;
      var maxZoomScale = 3;
      var mobileDefaultZoom = 1.3;
      var mobileZoomStorageKey = "gadaa_pdf_reader_mobile_zoom";
      var pinchActive = false;
      var pinchStartDistance = 0;
      var pinchStartZoom = 1;
      var pinchRenderTimer = null;
      var lastPinchCommitAt = 0;

      function syncExitControl() {
        if (!exitLink || !exitLabel) return;
        if (compactBottomBar.matches) {
          exitLink.href = exitLink.getAttribute("data-mobile-href") || "/library-store";
          exitLink.setAttribute("aria-label", "Library");
          exitLabel.textContent = "Library";
        } else {
          exitLink.href = exitLink.getAttribute("data-desktop-href") || "#";
          exitLink.setAttribute("aria-label", "Back to Book");
          exitLabel.textContent = "Back to Book";
        }
      }

      function showError(message) {
        if (loadingNode) loadingNode.hidden = true;
        if (errorNode) {
          errorNode.hidden = false;
          errorNode.textContent = message;
        }
      }

      function updateBottomBar() {
        if (!pdfDoc) return;
        var zoomPercent = Math.round(zoomScale * 100);
        var compactLabel = pageNum + " / " + pdfDoc.numPages + " | " + zoomPercent + "%";
        pageChip.textContent = compactBottomBar.matches
          ? compactLabel
          : ("Page " + pageNum + " of " + pdfDoc.numPages);
        pageChip.setAttribute("aria-label", "Current page " + pageNum + " of " + pdfDoc.numPages + ", zoom " + zoomPercent + " percent");
        prevBtn.disabled = isRendering || pageNum <= 1;
        nextBtn.disabled = isRendering || pageNum >= pdfDoc.numPages;
      }

      function queueRender(targetPage) {
        if (isRendering) {
          pendingPage = targetPage;
          return;
        }
        renderPage(targetPage);
      }

      async function renderPage(targetPage) {
        if (!pdfDoc) return;
        isRendering = true;
        updateBottomBar();
        if (loadingNode) loadingNode.hidden = false;
        if (errorNode) errorNode.hidden = true;

        try {
          var page = await pdfDoc.getPage(targetPage);
          var baseViewport = page.getViewport({ scale: 1 });
          var sideInset = compactBottomBar.matches ? 6 : 18;
          var availableWidth = Math.max(280, canvasWrap.clientWidth - sideInset);
          var fitScale = availableWidth / baseViewport.width;
          var viewport = page.getViewport({ scale: fitScale * zoomScale });
          var outputScale = Math.min(window.devicePixelRatio || 1, 2);

          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          canvas.style.width = Math.floor(viewport.width) + "px";
          canvas.style.height = Math.floor(viewport.height) + "px";

          var context = canvas.getContext("2d", { alpha: false });
          context.setTransform(outputScale, 0, 0, outputScale, 0, 0);

          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;

          pageNum = targetPage;
        } catch (_error) {
          showError("Could not render this PDF in the in-site reader.");
        } finally {
          isRendering = false;
          if (loadingNode) loadingNode.hidden = true;
          updateBottomBar();
          if (pendingPage !== null) {
            var nextPending = pendingPage;
            pendingPage = null;
            renderPage(nextPending);
          }
        }
      }

      function goPrev() {
        if (!pdfDoc || isRendering || pageNum <= 1) return;
        queueRender(pageNum - 1);
      }

      function goNext() {
        if (!pdfDoc || isRendering || pageNum >= pdfDoc.numPages) return;
        queueRender(pageNum + 1);
      }

      prevBtn.addEventListener("click", goPrev);
      nextBtn.addEventListener("click", goNext);

      document.addEventListener("keydown", function (event) {
        if (!pdfDoc || isRendering) return;
        if (event.altKey || event.ctrlKey || event.metaKey) return;

        if (event.key === "ArrowLeft") {
          event.preventDefault();
          goPrev();
          return;
        }
        if (event.key === "ArrowRight") {
          event.preventDefault();
          goNext();
        }
      });

      var touchStartX = 0;
      var touchStartY = 0;
      var touchActive = false;
      var panActive = false;
      var panMoved = false;
      var panLastX = 0;
      var panLastY = 0;
      var panMoveThreshold = 8;
      var lastTapAt = 0;
      var lastTapX = 0;
      var lastTapY = 0;
      var doubleTapWindowMs = 280;
      var doubleTapMaxDrift = 26;

      function touchDistance(touchA, touchB) {
        var dx = touchA.clientX - touchB.clientX;
        var dy = touchA.clientY - touchB.clientY;
        return Math.sqrt((dx * dx) + (dy * dy));
      }

      function clampZoom(scale) {
        return Math.max(minZoomScale, Math.min(maxZoomScale, scale));
      }

      function loadPreferredZoom() {
        if (!compactBottomBar.matches) {
          return 1;
        }
        var fallbackZoom = clampZoom(mobileDefaultZoom);
        try {
          var raw = window.localStorage ? window.localStorage.getItem(mobileZoomStorageKey) : null;
          if (!raw) return fallbackZoom;
          var parsed = Number(raw);
          if (!Number.isFinite(parsed)) return fallbackZoom;
          return clampZoom(parsed);
        } catch (_err) {
          return fallbackZoom;
        }
      }

      function persistPreferredZoom() {
        if (!compactBottomBar.matches) return;
        try {
          if (window.localStorage) {
            window.localStorage.setItem(mobileZoomStorageKey, String(clampZoom(zoomScale)));
          }
        } catch (_err) {
          // Ignore storage errors (private mode / quota / policy).
        }
      }

      function commitPinchZoom() {
        if (!pdfDoc) return;
        if (pinchRenderTimer) {
          window.clearTimeout(pinchRenderTimer);
          pinchRenderTimer = null;
        }
        persistPreferredZoom();
        queueRender(pageNum);
      }

      function isMobileReader() {
        return compactBottomBar.matches;
      }

      function handleDoubleTap(touchPoint) {
        if (!isMobileReader() || !touchPoint) return false;
        var now = Date.now();
        var dx = touchPoint.clientX - lastTapX;
        var dy = touchPoint.clientY - lastTapY;
        var isCloseTap = (Math.abs(dx) <= doubleTapMaxDrift) && (Math.abs(dy) <= doubleTapMaxDrift);
        var isDoubleTap = (now - lastTapAt) <= doubleTapWindowMs && isCloseTap;

        lastTapAt = now;
        lastTapX = touchPoint.clientX;
        lastTapY = touchPoint.clientY;

        if (!isDoubleTap) return false;

        var targetZoom = zoomScale >= 1.7 ? loadPreferredZoom() : clampZoom(Math.max(1.9, loadPreferredZoom()));
        zoomScale = targetZoom;
        updateBottomBar();
        commitPinchZoom();
        return true;
      }

      canvasWrap.addEventListener("touchstart", function (event) {
        if (!event.touches) return;

        if (event.touches.length === 2) {
          pinchActive = true;
          panActive = false;
          panMoved = false;
          touchActive = false;
          pinchStartDistance = touchDistance(event.touches[0], event.touches[1]);
          pinchStartZoom = zoomScale;
          lastTapAt = 0;
          return;
        }

        if (event.touches.length === 1) {
          if (pinchActive) return;
          touchStartX = event.touches[0].clientX;
          touchStartY = event.touches[0].clientY;
          touchActive = true;
          panMoved = false;
          if (zoomScale > 1) {
            panActive = true;
            panLastX = event.touches[0].clientX;
            panLastY = event.touches[0].clientY;
          } else {
            panActive = false;
          }
        }
      }, { passive: true });

      canvasWrap.addEventListener("touchmove", function (event) {
        if (!event.touches) return;

        if (event.touches.length === 2) {
          if (!pinchActive) {
            pinchActive = true;
            panActive = false;
            panMoved = false;
            touchActive = false;
            pinchStartDistance = touchDistance(event.touches[0], event.touches[1]);
            pinchStartZoom = zoomScale;
          }

          var newDistance = touchDistance(event.touches[0], event.touches[1]);
          if (pinchStartDistance > 0) {
            var nextZoom = clampZoom(pinchStartZoom * (newDistance / pinchStartDistance));
            if (Math.abs(nextZoom - zoomScale) >= 0.02) {
              zoomScale = nextZoom;
              updateBottomBar();
              var now = Date.now();
              if ((now - lastPinchCommitAt) > 120) {
                lastPinchCommitAt = now;
                commitPinchZoom();
              } else {
                if (pinchRenderTimer) window.clearTimeout(pinchRenderTimer);
                pinchRenderTimer = window.setTimeout(function () {
                  lastPinchCommitAt = Date.now();
                  commitPinchZoom();
                }, 120);
              }
            }
          }
          event.preventDefault();
          return;
        }

        if (event.touches.length === 1 && panActive && zoomScale > 1) {
          var touch = event.touches[0];
          var moveX = touch.clientX - panLastX;
          var moveY = touch.clientY - panLastY;
          canvasWrap.scrollLeft = canvasWrap.scrollLeft - moveX;
          canvasWrap.scrollTop = canvasWrap.scrollTop - moveY;
          panLastX = touch.clientX;
          panLastY = touch.clientY;
          if (!panMoved) {
            if (Math.abs(touch.clientX - touchStartX) > panMoveThreshold || Math.abs(touch.clientY - touchStartY) > panMoveThreshold) {
              panMoved = true;
            }
          }
          event.preventDefault();
        }
      }, { passive: false });

      canvasWrap.addEventListener("touchend", function (event) {
        if (pinchActive && (!event.touches || event.touches.length < 2)) {
          pinchActive = false;
          panActive = false;
          panMoved = false;
          touchActive = false;
          commitPinchZoom();
          return;
        }

        if (panActive) {
          panActive = false;
          touchActive = false;
          if (panMoved) {
            panMoved = false;
            lastTapAt = 0;
            return;
          }
        }

        if (isMobileReader() && touchActive && event.changedTouches && event.changedTouches.length === 1) {
          if (handleDoubleTap(event.changedTouches[0])) {
            touchActive = false;
            panMoved = false;
            return;
          }
        }
        touchActive = false;
        panMoved = false;
      }, { passive: true });

      canvasWrap.addEventListener("touchcancel", function () {
        touchActive = false;
        panActive = false;
        panMoved = false;
        pinchActive = false;
        lastTapAt = 0;
        if (pinchRenderTimer) {
          window.clearTimeout(pinchRenderTimer);
          pinchRenderTimer = null;
        }
      }, { passive: true });

      var resizeTimer = null;
      window.addEventListener("resize", function () {
        if (!pdfDoc || isRendering) return;
        if (resizeTimer) window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(function () {
          queueRender(pageNum);
        }, 150);
      });

      function initPdfReader() {
        if (!window.pdfjsLib) {
          showError("PDF engine failed to load.");
          return;
        }

        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        var loadingTask = window.pdfjsLib.getDocument({
          url: pdfUrl,
          withCredentials: true
        });

        loadingTask.promise.then(function (doc) {
          pdfDoc = doc;
          zoomScale = loadPreferredZoom();
          pageNum = 1;
          pendingPage = null;
          updateBottomBar();
          queueRender(pageNum);
        }).catch(function () {
          showError("Unable to open this PDF inside the reader.");
        });
      }

      syncExitControl();
      if (typeof compactBottomBar.addEventListener === "function") {
        compactBottomBar.addEventListener("change", syncExitControl);
      } else if (typeof compactBottomBar.addListener === "function") {
        compactBottomBar.addListener(syncExitControl);
      }
      initPdfReader();
    });
  </script>
</body>
</html>
