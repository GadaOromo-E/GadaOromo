<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="{{ (book.title ~ ' PDF reader') if book else 'PDF reader' }}" />
  <link rel="canonical" href="{{ (WEBSITE_URL or 'https://gadaadictionary.com') ~ '/read/pdf/' ~ (book.id if book else '') }}">
  <meta name="robots" content="noindex,follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ (book.title ~ ' | PDF Reader') if book else 'PDF Reader' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=20260218-2">
</head>
<body class="pdf-reader-page pdf-reader-minimal">
<main class="reader-app-shell">
  {% if load_error %}
    <section class="result-box reader-inline-message">
      <div class="muted">{{ load_error }}</div>
    </section>
  {% endif %}

  {% if reader_error %}
    <section class="result-box reader-inline-message">
      <div class="muted">{{ reader_error }}</div>
    </section>
  {% else %}
    <section class="reader-surface reader-deterrent" id="reader-stage" oncontextmenu="return false;">
      <iframe
        class="reader-frame reader-frame-minimal"
        id="pdf-iframe"
        src="{{ pdf_stream_url }}"
        title="Protected PDF reader for {{ book.title }}"
        loading="eager"
        referrerpolicy="same-origin">
      </iframe>
    </section>
  {% endif %}
</main>
<nav class="reader-bottom-bar" aria-label="Reader controls">
  <a class="btn" href="/book/{{ book.id|urlencode }}">Back to Book</a>
  <button class="btn primary" id="pdf-next" type="button" {% if reader_error %}disabled aria-disabled="true"{% endif %}>Next page</button>
  <a class="reader-open-link" href="{{ pdf_stream_url }}" target="_blank" rel="noopener noreferrer">Open protected PDF in a new tab</a>
</nav>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var readerStage = document.getElementById("reader-stage");
    if (readerStage) {
      readerStage.addEventListener("contextmenu", function (event) {
        event.preventDefault();
      });
      ["copy", "cut", "selectstart"].forEach(function (eventName) {
        readerStage.addEventListener(eventName, function (event) {
          event.preventDefault();
        });
      });
    }

    var pdfStreamUrl = {{ pdf_stream_url|tojson }};
    var iframe = document.getElementById("pdf-iframe");
    var nextBtn = document.getElementById("pdf-next");

    if (!pdfStreamUrl || !iframe || !nextBtn) return;

    var currentPage = 1;
    function renderPageInIframe(page) {
      iframe.src = pdfStreamUrl + "#page=" + page;
    }

    nextBtn.addEventListener("click", function () {
      currentPage += 1;
      renderPageInIframe(currentPage);
    });

    document.addEventListener("keydown", function (event) {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key === "ArrowRight") {
        event.preventDefault();
        currentPage += 1;
        renderPageInIframe(currentPage);
      }
    });

    ["copy", "cut", "selectstart", "contextmenu"].forEach(function (eventName) {
      document.addEventListener(eventName, function (event) {
        var inReader = event.target && event.target.closest && event.target.closest("#reader-stage");
        if (inReader) {
          event.preventDefault();
        }
      });
    });
  });
</script>
</body>
</html>
